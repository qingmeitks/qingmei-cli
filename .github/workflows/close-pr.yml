name: Auto Close External PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close-pr:
    runs-on: ubuntu-latest
    if: github.actor != github.repository_owner
    steps:
      - name: Close Pull Request
        run: |
          gh pr close ${{ github.event.pull_request.number }} --comment "本项目目前由作者独立维护，暂不接收外部代码贡献与 PR。如发现问题或有功能建议，欢迎在 Issues 中交流探讨，感谢您的理解与支持！❤️\n\n(This project does not accept external pull requests at this time. Please open an issue instead. Thank you!)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
